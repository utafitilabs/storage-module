name: CI

# Gatekeeper: every push and pull request must pass the full standard
# (code style -> static analysis -> tests) before it is valid for review.
on:
  push:
    branches: ['**']   # every version line (0.1, 0.2, …) and every feature branch
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    # A real database for the integration suite, and the charter is intact:
    # this bundle owns no entities. The database is the core's — the Files hub is
    # a widget dashboard, one person's arrangement of one is a stored row, and
    # the bundle that owns the row owns its schema. Plain Postgres: the kernel
    # boots the registry, the shell and the team, none of which stores geometry,
    # and AreaBundle — the one core bundle that does — is not in it.
    #
    # The bytes are a different thing entirely and still go where they always
    # did: the local adapter writes them into a temp directory during the tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: storage_bundle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      STORAGE_TEST_DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/storage_bundle_test?serverVersion=17&charset=utf8"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        # gd is required by the thumbnail tests. imagick is deliberately NOT
        # installed here: CI then exercises the same GD-only path most
        # developer machines have, including the honest "HEIC arrived and
        # nothing on this box can decode it" branch.
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, gd, fileinfo, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Code style (php-cs-fixer)
        run: composer cs:check

      - name: Static analysis (PHPStan max)
        run: composer phpstan

      - name: Tests (PHPUnit)
        run: composer test